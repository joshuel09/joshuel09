<svg xmlns="http://www.w3.org/2000/svg" width="82" height="64" viewBox="0 0 82 64" role="img" aria-label="Millennium Falcon jumping to lightspeed">
  <title>Millennium Falcon — punch it</title>
  <defs>
    <linearGradient id="hull" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#eef2f7"/><stop offset="28%" stop-color="#bcc5cf"/>
      <stop offset="58%" stop-color="#8b949f"/><stop offset="100%" stop-color="#424951"/>
    </linearGradient>
    <radialGradient id="eng">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset="30%" stop-color="#c8ecff" stop-opacity=".82"/>
      <stop offset="62%" stop-color="#6fd0ff" stop-opacity=".44"/>
      <stop offset="100%" stop-color="#3fbaff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vign" cx="0.780" cy="0.219" r="1">
      <stop offset="0%" stop-color="#1b2a47"/><stop offset="55%" stop-color="#0a1020"/>
      <stop offset="100%" stop-color="#04060d"/>
    </radialGradient>
    <clipPath id="frame"><rect width="82" height="64" rx="11"/></clipPath>
  </defs>
  <style>
    .hs { fill: #dcefff; opacity: 0; transform-box: fill-box; transform-origin: 0% 50%;
           animation: hs 1.05s linear infinite; }
    .ship  { transform-box: view-box; transform-origin: 33.0px 37.0px;
              animation: rock 5s ease-in-out infinite; }
    .eglow { animation: pulse .8s ease-in-out infinite alternate; }
    .ecore { animation: pulsec .5s ease-in-out infinite alternate; }
    @keyframes hs { 0% { opacity:0; transform: translateX(0) scaleX(.18) }
                     16% { opacity:1 }
                     100% { opacity:0; transform: translateX(62px) scaleX(3.4) } }
    @keyframes rock { 0%,100% { transform: translate(.5px,.4px) rotate(.7deg) }
                       50% { transform: translate(-.5px,-.4px) rotate(-.7deg) } }
    @keyframes pulse  { from { opacity:.5 } to { opacity:1 } }
    @keyframes pulsec { from { opacity:.72 } to { opacity:1 } }
    @media (prefers-reduced-motion: reduce) { .hs,.ship,.eglow,.ecore { animation: none } .hs { opacity:.45 } }
  </style>
