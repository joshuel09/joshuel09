<svg xmlns="http://www.w3.org/2000/svg" width="57" height="72" viewBox="0 0 57 72" role="img" aria-label="Mandalorian helmet">
  <title>Mandalorian helmet</title>
  <defs>
    <linearGradient id="besk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4f8fb"/><stop offset="26%" stop-color="#c6cfd9"/>
      <stop offset="54%" stop-color="#99a3af"/><stop offset="78%" stop-color="#6e7782"/>
      <stop offset="100%" stop-color="#3e454e"/>
    </linearGradient>
    <linearGradient id="ear" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d2dae2"/><stop offset="55%" stop-color="#8d96a2"/>
      <stop offset="100%" stop-color="#434a54"/>
    </linearGradient>
    <linearGradient id="keel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8e97a2"/><stop offset="40%" stop-color="#fbfdff"/>
      <stop offset="100%" stop-color="#79828d"/>
    </linearGradient>
    <linearGradient id="vis" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14323c"/><stop offset="45%" stop-color="#0a1a21"/>
      <stop offset="100%" stop-color="#04090d"/>
    </linearGradient>
    <g id="visorG">
      <!-- eye slot: straight top, lower edge angling down to the centre -->
      <path d="M6.6 29 L50.4 29 L50.4 31.6 L35.2 38 L21.8 38 L6.6 31.6 Z"/>
      <!-- centre strip: runs the full way down to the chin edge -->
      <path d="M21.8 38 L35.2 38 L32 68.4 L31.2 71.2 L25.8 71.2 L25 68.4 Z"/>
      <!-- cheek wings: from under the slot ends, sweeping down and inward -->
      <path d="M4.6 38.6 C5.4 46.5 10.5 57.5 20.8 68.2 L22.4 67.6 C17.5 57.5 13.2 46.5 11.2 39.4 Z"/>
      <path d="M52.4 38.6 C51.6 46.5 46.5 57.5 36.2 68.2 L34.6 67.6 C39.5 57.5 43.8 46.5 45.8 39.4 Z"/>
    </g>
    <clipPath id="vclip"><use href="#visorG"/></clipPath>
  </defs>
  <style>
    .h     { transform-box: view-box; transform-origin: 28.5px 64px; animation: tilt 5.2s ease-in-out infinite; }
    .glint { animation: sweep 4.6s cubic-bezier(.5,0,.5,1) infinite; }
    @keyframes tilt  { 0%,100% { transform: rotate(-1.5deg) } 50% { transform: rotate(1.5deg) } }
    @keyframes sweep { 0%,62% { transform: translateX(-46px) } 86%,100% { transform: translateX(46px) } }
    @media (prefers-reduced-motion: reduce) { .h,.glint { animation: none } .glint { opacity: 0 } }
  </style>
  <g class="h">
    <!-- comm / ear plates -->
    <path d="M0.5 27 L5.6 24.6 L5.6 55.6 L2.8 59.4 L0.5 53.6 Z" fill="url(#ear)" stroke="#2f353d" stroke-width="1" stroke-linejoin="round"/>
    <path d="M56.5 27 L51.4 24.6 L51.4 55.6 L54.2 59.4 L56.5 53.6 Z" fill="url(#ear)" stroke="#2f353d" stroke-width="1" stroke-linejoin="round"/>
    <!-- shell: domed crown, near-vertical sides, angular jaw, flat chin -->
    <path d="M3.6 25.2 C4.1 10.4 14.4 0.6 28.5 0.6 C42.6 0.6 52.9 10.4 53.4 25.2
             L53.4 47 C53.2 53 52.2 56.8 50.6 59.4 L45 65.4 L36.6 71.2
             L20.4 71.2 L12 65.4 L6.4 59.4 C4.8 56.8 3.8 53 3.6 47 Z"
          fill="url(#besk)" stroke="#2b3138" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- brow seam -->
    <path d="M3.9 25.4 Q28.5 27.6 53.1 25.4" fill="none" stroke="#5c646f" stroke-width="1.1" opacity=".75"/>
    <!-- raised keel ridge -->
    <path d="M24.2 0.9 L24.2 21 C24.2 24.3 32.8 24.3 32.8 21 L32.8 0.9"
          fill="url(#keel)" stroke="#39404a" stroke-width="1" stroke-linejoin="round"/>
    <!-- dome sheen -->
    <path d="M7.6 23 C8.6 12.6 13.6 5.4 20 2.6" fill="none" stroke="#ffffff"
          stroke-width="2.1" opacity=".4" stroke-linecap="round"/>
    <!-- visor -->
    <use href="#visorG" fill="url(#vis)"/>
    <g clip-path="url(#vclip)">
      <rect class="glint" x="-12" y="24" width="8" height="52" fill="#9fe8ff" opacity=".42" transform="skewX(-16)"/>
    </g>
    <use href="#visorG" fill="none" stroke="#1b2228" stroke-width=".9" stroke-linejoin="round"/>
    <path d="M7.4 28.6 L49.6 28.6" stroke="#e9eff6" stroke-width="1" opacity=".45" stroke-linecap="round"/>
  </g>
</svg>
