<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" role="img" aria-label="Hologram projector"><title>Hologram projector</title>
  <defs>
    <linearGradient id="beam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#6fe0ff" stop-opacity=".62"/>
      <stop offset="60%" stop-color="#6fe0ff" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#6fe0ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9beeff" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#1b9fd4" stop-opacity=".8"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#aab4c0"/><stop offset="100%" stop-color="#3b424b"/>
    </linearGradient>
    <clipPath id="pclip"><path d="M10 15.5 L34 7.5 L40 19 L16 27 Z"/></clipPath>
  </defs>
  <style>
    .ink{stroke:#1b2029;stroke-linejoin:round}
    .holo{transform-box:view-box;transform-origin:24px 18px;animation:bob 3.4s ease-in-out infinite}
    .fl{animation:flick 2.4s ease-in-out infinite}
    .sl{animation:slide 1.9s linear infinite}
    @keyframes bob{0%,100%{transform:translateY(-1px)}50%{transform:translateY(1px)}}
    @keyframes flick{0%,100%{opacity:1}47%{opacity:.68}58%{opacity:1}}
    @keyframes slide{from{transform:translateY(-20px)}to{transform:translateY(24px)}}
    @media (prefers-reduced-motion:reduce){.holo,.fl,.sl{animation:none}}
  </style>
  <!-- projection cone -->
  <path d="M20.5 39 L10 16 H40 L27.5 39 Z" fill="url(#beam)"/>
  <!-- floating holo-pane, tilted in perspective -->
  <g class="holo"><g class="fl">
    <path class="ink" d="M10 15.5 L34 7.5 L40 19 L16 27 Z" fill="url(#pane)" stroke-width="1.8" opacity=".92"/>
    <g fill="#083d52" opacity=".85">
      <path d="M14.6 16.2 L26 12.4 L27 14.3 L15.6 18.1 Z"/>
      <path d="M17 20.2 L32 15.2 L32.8 16.8 L17.8 21.8 Z"/>
      <path d="M19.2 23.6 L28 20.7 L28.8 22.3 L20 25.2 Z"/>
    </g>
    <g clip-path="url(#pclip)">
      <rect class="sl" x="6" y="6" width="38" height="3.2" fill="#ffffff" opacity=".45"/>
    </g>
  </g></g>
  <!-- projector base -->
  <g class="ink" stroke-width="2.1">
    <ellipse cx="24" cy="41" rx="12.5" ry="4.4" fill="url(#base)"/>
  </g>
  <ellipse cx="24" cy="39.4" rx="6.2" ry="2.2" fill="#9beeff"/>
  <ellipse class="fl" cx="24" cy="39.4" rx="3" ry="1.1" fill="#ffffff"/>
</svg>
