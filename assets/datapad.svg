<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" role="img" aria-label="Datapad"><title>Datapad</title>
  <defs>
    <linearGradient id="case" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#aeb7c2"/><stop offset="50%" stop-color="#78828e"/>
      <stop offset="100%" stop-color="#3b424b"/>
    </linearGradient>
    <linearGradient id="scr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d4f68"/><stop offset="100%" stop-color="#06303f"/>
    </linearGradient>
    <clipPath id="sc"><rect x="13.5" y="10" width="21" height="24" rx="1.8"/></clipPath>
  </defs>
  <style>
    .ink{stroke:#1b2029;stroke-linejoin:round}
    .row{animation:feed 3.2s linear infinite}
    .led{animation:pulse 1.1s ease-in-out infinite alternate}
    @keyframes feed{from{transform:translateY(0)}to{transform:translateY(-12px)}}
    @keyframes pulse{from{opacity:.35}to{opacity:1}}
    @media (prefers-reduced-motion:reduce){.row,.led{animation:none}}
  </style>
  <g class="ink" stroke-width="2.2">
    <rect x="9.5" y="5" width="29" height="38" rx="4.5" fill="url(#case)"/>
    <rect x="13.5" y="10" width="21" height="24" rx="1.8" fill="url(#scr)" stroke-width="1.6"/>
  </g>
  <g clip-path="url(#sc)">
    <g class="row" fill="#6fe3ff">
      <rect x="16" y="12" width="13" height="1.9" rx=".9"/>
      <rect x="16" y="16" width="9" height="1.9" rx=".9"/>
      <rect x="16" y="20" width="15" height="1.9" rx=".9"/>
      <rect x="16" y="24" width="11" height="1.9" rx=".9"/>
      <rect x="16" y="28" width="14" height="1.9" rx=".9"/>
      <rect x="16" y="32" width="8" height="1.9" rx=".9"/>
      <rect x="16" y="36" width="13" height="1.9" rx=".9"/>
      <rect x="16" y="40" width="10" height="1.9" rx=".9"/>
    </g>
  </g>
  <rect x="13.5" y="10" width="21" height="10" rx="1.8" fill="#ffffff" opacity=".10"/>
  <circle class="led" cx="24" cy="38.5" r="2" fill="#6fe3ff"/>
  <rect x="38" y="13" width="2.6" height="7" rx="1.3" fill="#5a6470"/>
</svg>
