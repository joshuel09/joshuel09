  <style>
    @keyframes tw { 0%,100% { opacity:.15 } 50% { opacity:.95 } }
    @keyframes hum  { from { opacity:.52 } to { opacity:.98 } }
    @keyframes humc { from { opacity:.80 } to { opacity:1 } }
    @keyframes blade { 0% { transform:scaleX(0) } 2.06% { transform:scaleX(0) } 3.98% { transform:scaleX(1.06) } 5.16% { transform:scaleX(1) } 14.08% { transform:scaleX(1) } 15.70% { transform:scaleX(0) } 29.48% { transform:scaleX(0) } 31.39% { transform:scaleX(1.06) } 32.57% { transform:scaleX(1) } 55.12% { transform:scaleX(1) } 56.74% { transform:scaleX(0) } 61.83% { transform:scaleX(0) } 63.74% { transform:scaleX(1.06) } 64.92% { transform:scaleX(1) } 88.14% { transform:scaleX(1) } 89.76% { transform:scaleX(0) } 100% { transform:scaleX(0) } }
    @keyframes cl0 { 0%,8.28% { opacity:0; transform:scale(.3) } 9.25% { opacity:1; transform:scale(1.12) } 10.95% { opacity:0; transform:scale(1.65) } 100% { opacity:0 } }
    @keyframes sp0 { 0%,8.28% { opacity:0; transform:scale(.2) } 9.25% { opacity:1 } 11.68% { opacity:0; transform:scale(2.5) } 100% { opacity:0 } }
    @keyframes cl1 { 0%,10.32% { opacity:0; transform:scale(.3) } 11.28% { opacity:1; transform:scale(1.12) } 12.98% { opacity:0; transform:scale(1.65) } 100% { opacity:0 } }
    @keyframes sp1 { 0%,10.32% { opacity:0; transform:scale(.2) } 11.28% { opacity:1 } 13.72% { opacity:0; transform:scale(2.5) } 100% { opacity:0 } }
    @keyframes cl2 { 0%,47.65% { opacity:0; transform:scale(.3) } 48.62% { opacity:1; transform:scale(1.12) } 50.31% { opacity:0; transform:scale(1.65) } 100% { opacity:0 } }
    @keyframes sp2 { 0%,47.65% { opacity:0; transform:scale(.2) } 48.62% { opacity:1 } 51.05% { opacity:0; transform:scale(2.5) } 100% { opacity:0 } }
    @keyframes cl3 { 0%,80.09% { opacity:0; transform:scale(.3) } 81.06% { opacity:1; transform:scale(1.12) } 82.76% { opacity:0; transform:scale(1.65) } 100% { opacity:0 } }
    @keyframes sp3 { 0%,80.09% { opacity:0; transform:scale(.2) } 81.06% { opacity:1 } 83.49% { opacity:0; transform:scale(2.5) } 100% { opacity:0 } }
    .bd   { transform-box: fill-box; transform-origin: 0% 50%;
             animation: blade 13.57s cubic-bezier(.2,.8,.3,1) infinite both; }
    .halo { animation: hum .17s ease-in-out infinite alternate both; }
    .core { animation: humc .12s ease-in-out infinite alternate both; }
    .cl   { opacity: 0; transform-box: view-box; animation: 13.57s linear infinite both; }
    .spk circle { transform-box: view-box; animation: 13.57s linear infinite both; }
    .c0 { animation-name: cl0; } .c0 .spk circle { animation-name: sp0; }
    .c1 { animation-name: cl1; } .c1 .spk circle { animation-name: sp1; }
    .c2 { animation-name: cl2; } .c2 .spk circle { animation-name: sp2; }
    .c3 { animation-name: cl3; } .c3 .spk circle { animation-name: sp3; }
    @media (prefers-reduced-motion: reduce) {
      .bd, .halo, .core, .cl, .spk circle, .st { animation: none; }
      .bd { transform: none; } .cl { opacity: 0; }
    }
  </style>
