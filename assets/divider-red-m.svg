<svg xmlns="http://www.w3.org/2000/svg" width="420" height="30" viewBox="0 0 420 30" role="img" aria-label="lightsaber divider">
  <title>— lightsaber —</title>
  <metadata>Copyright (c) 2026 Joshuel Ranola (@joshuel09). All rights reserved. Unauthorised copying or redistribution prohibited. https://github.com/joshuel09</metadata>
  <defs>
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="420" height="30">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="hilt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b8f96"/><stop offset="50%" stop-color="#e5e7eb"/><stop offset="100%" stop-color="#4b5563"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes tw { 0%,100% { opacity:.15 } 50% { opacity:.95 } }
    @keyframes ignite { from { stroke-dashoffset:388 } to { stroke-dashoffset:0 } }
    @keyframes breathe { 0%,100% { opacity:.5 } 50% { opacity:.9 } }
    .beam { stroke-dasharray:388; stroke-dashoffset:0;
             animation:ignite 1.1s cubic-bezier(.2,.8,.3,1) .25s 1 both }
    .halo { stroke-dasharray:388; stroke-dashoffset:0;
             animation:ignite 1.1s cubic-bezier(.2,.8,.3,1) .25s 1 both,
                       breathe 3.6s ease-in-out 1.4s infinite both }
  </style>
  <rect width="420" height="30" fill="#000"/>
<circle cx="257.0" cy="6.3" r="0.39" fill="#fff" opacity="0.6" style="animation:tw 2.4s ease-in-out -1.65s infinite"/>
<circle cx="409.8" cy="19.3" r="0.99" fill="#fff" opacity="0.62" style="animation:tw 3.2s ease-in-out -2.03s infinite"/>
<circle cx="395.1" cy="7.1" r="0.43" fill="#fff" opacity="0.86" style="animation:tw 4.1s ease-in-out -1.47s infinite"/>
<circle cx="237.2" cy="8.5" r="0.37" fill="#fff" opacity="0.72" style="animation:tw 5.0s ease-in-out -3.69s infinite"/>
<circle cx="177.7" cy="15.7" r="0.55" fill="#fff" opacity="0.36" style="animation:tw 2.4s ease-in-out -0.97s infinite"/>
<circle cx="376.5" cy="24.4" r="0.63" fill="#fff" opacity="0.62" style="animation:tw 3.2s ease-in-out -1.85s infinite"/>
<circle cx="142.4" cy="19.9" r="0.47" fill="#fff" opacity="0.44" style="animation:tw 4.1s ease-in-out -0.98s infinite"/>
<circle cx="175.3" cy="16.2" r="0.79" fill="#fff" opacity="0.88" style="animation:tw 5.0s ease-in-out -2.37s infinite"/>
<circle cx="333.2" cy="15.9" r="0.81" fill="#fff" opacity="0.39" style="animation:tw 2.4s ease-in-out -1.24s infinite"/>
<circle cx="359.6" cy="16.9" r="0.64" fill="#fff" opacity="0.88" style="animation:tw 3.2s ease-in-out -1.41s infinite"/>
<circle cx="409.7" cy="8.6" r="0.68" fill="#fff" opacity="0.58" style="animation:tw 4.1s ease-in-out -3.75s infinite"/>
<circle cx="338.5" cy="1.6" r="0.59" fill="#fff" opacity="0.58" style="animation:tw 5.0s ease-in-out -3.18s infinite"/>
<circle cx="411.7" cy="8.5" r="0.5" fill="#fff" opacity="0.85" style="animation:tw 2.4s ease-in-out -1.47s infinite"/>
<circle cx="142.3" cy="26.1" r="0.4" fill="#fff" opacity="0.86" style="animation:tw 3.2s ease-in-out -2.0s infinite"/>
<circle cx="40.6" cy="2.5" r="0.89" fill="#fff" opacity="0.55" style="animation:tw 4.1s ease-in-out -0.4s infinite"/>
<circle cx="328.8" cy="1.6" r="0.5" fill="#fff" opacity="0.42" style="animation:tw 5.0s ease-in-out -0.35s infinite"/>
<circle cx="146.1" cy="12.3" r="0.88" fill="#fff" opacity="0.72" style="animation:tw 2.4s ease-in-out -0.66s infinite"/>
<circle cx="93.3" cy="5.5" r="0.85" fill="#fff" opacity="0.36" style="animation:tw 3.2s ease-in-out -0.37s infinite"/>
<circle cx="396.6" cy="24.2" r="0.49" fill="#fff" opacity="0.38" style="animation:tw 4.1s ease-in-out -1.36s infinite"/>
<circle cx="123.1" cy="9.3" r="0.93" fill="#fff" opacity="0.59" style="animation:tw 5.0s ease-in-out -4.08s infinite"/>
<circle cx="206.7" cy="26.4" r="0.5" fill="#fff" opacity="0.62" style="animation:tw 2.4s ease-in-out -1.93s infinite"/>
<circle cx="287.7" cy="23.2" r="0.75" fill="#fff" opacity="0.55" style="animation:tw 3.2s ease-in-out -1.62s infinite"/>
<circle cx="192.7" cy="26.7" r="0.66" fill="#fff" opacity="0.41" style="animation:tw 4.1s ease-in-out -1.71s infinite"/>
<circle cx="260.2" cy="2.2" r="0.6" fill="#fff" opacity="0.69" style="animation:tw 5.0s ease-in-out -3.2s infinite"/>
<circle cx="323.4" cy="4.6" r="1.0" fill="#fff" opacity="0.72" style="animation:tw 2.4s ease-in-out -0.89s infinite"/>
<circle cx="311.2" cy="6.2" r="0.54" fill="#fff" opacity="0.43" style="animation:tw 3.2s ease-in-out -2.14s infinite"/>
  <rect x="4" y="9" width="18" height="12" rx="2.5" fill="url(#hilt)"/>
  <rect x="8" y="11" width="2" height="8" fill="#0b0b12" opacity=".8"/>
  <rect x="14" y="11" width="2" height="8" fill="#0b0b12" opacity=".8"/>
  <line class="halo" x1="24" y1="15" x2="412" y2="15" stroke="#FF3B3B" stroke-width="11" stroke-linecap="round" filter="url(#glow)" opacity=".5"/>
  <line class="beam" x1="24" y1="15" x2="412" y2="15" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round"/>
</svg>
