<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" role="img" aria-label="Jedi holocron"><title>Jedi holocron</title>
  <defs>
    <linearGradient id="fT" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9fe9ff"/><stop offset="100%" stop-color="#3aa8e0"/>
    </linearGradient>
    <linearGradient id="fL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2f8fc8"/><stop offset="100%" stop-color="#145a86"/>
    </linearGradient>
    <linearGradient id="fR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4fb5e6"/><stop offset="100%" stop-color="#1d6f9e"/>
    </linearGradient>
    <radialGradient id="aura">
      <stop offset="0%" stop-color="#9fe9ff" stop-opacity=".75"/>
      <stop offset="100%" stop-color="#3aa8e0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .ink{stroke:#13303f;stroke-linejoin:round}
    .au{animation:glow 2.2s ease-in-out infinite alternate}
    .cb{transform-box:view-box;transform-origin:24px 25px;animation:hover 3.8s ease-in-out infinite}
    .cr{animation:core 1.6s ease-in-out infinite alternate}
    @keyframes glow{from{opacity:.4}to{opacity:.95}}
    @keyframes hover{0%,100%{transform:translateY(1.2px) rotate(-2deg)}50%{transform:translateY(-1.2px) rotate(2deg)}}
    @keyframes core{from{opacity:.45}to{opacity:1}}
    @media (prefers-reduced-motion:reduce){.au,.cb,.cr{animation:none}}
  </style>
  <circle class="au" cx="24" cy="25" r="20" fill="url(#aura)"/>
  <g class="cb">
    <g class="ink" stroke-width="2">
      <path d="M24 7 L39 15.5 L24 24 L9 15.5 Z" fill="url(#fT)"/>
      <path d="M9 15.5 L24 24 L24 41 L9 32.5 Z" fill="url(#fL)"/>
      <path d="M39 15.5 L24 24 L24 41 L39 32.5 Z" fill="url(#fR)"/>
    </g>
    <path class="cr" d="M24 13.4 L31.6 17.8 L24 22.2 L16.4 17.8 Z" fill="#eafaff" opacity=".85"/>
    <rect class="cr" x="12.6" y="22.4" width="2.4" height="9" rx="1.2" fill="#cdf3ff" opacity=".7"/>
    <rect class="cr" x="33" y="22.4" width="2.4" height="9" rx="1.2" fill="#cdf3ff" opacity=".7"/>
  </g>
</svg>
