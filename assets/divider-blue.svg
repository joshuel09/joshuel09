<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="36" viewBox="0 0 1000 36" role="img" aria-label="lightsaber divider">
  <title>— lightsaber —</title>
  <metadata>Copyright (c) 2026 Joshuel Ranola (@joshuel09). All rights reserved. Unauthorised copying or redistribution prohibited. https://github.com/joshuel09</metadata>
  <defs>
    <linearGradient id="hilt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b8f96"/><stop offset="38%" stop-color="#eef1f5"/>
      <stop offset="62%" stop-color="#7c8795"/><stop offset="100%" stop-color="#394049"/>
    </linearGradient>
    <linearGradient id="hilt2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8c2cf"/><stop offset="45%" stop-color="#f4f7fa"/>
      <stop offset="100%" stop-color="#3b434e"/>
    </linearGradient>
    <linearGradient id="halo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4BD5EE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#4BD5EE" stop-opacity=".66"/>
      <stop offset="100%" stop-color="#4BD5EE" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="burst">
      <stop offset="0%" stop-color="#fff" stop-opacity=".95"/>
      <stop offset="42%" stop-color="#4BD5EE" stop-opacity=".7"/>
      <stop offset="100%" stop-color="#4BD5EE" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    @keyframes tw { 0%,100% { opacity:.15 } 50% { opacity:.95 } }
    @keyframes hum  { from { opacity:.52 } to { opacity:.98 } }
    @keyframes humc { from { opacity:.80 } to { opacity:1 } }
    @keyframes blade { 0% { transform:scaleX(0) } 2.18% { transform:scaleX(0) } 4.21% { transform:scaleX(1.06) } 5.45% { transform:scaleX(1) } 25.86% { transform:scaleX(1) } 27.57% { transform:scaleX(0) } 33.02% { transform:scaleX(0) } 35.05% { transform:scaleX(1.06) } 36.29% { transform:scaleX(1) } 51.09% { transform:scaleX(1) } 52.80% { transform:scaleX(0) } 63.24% { transform:scaleX(0) } 65.26% { transform:scaleX(1.06) } 66.51% { transform:scaleX(1) } 84.50% { transform:scaleX(1) } 86.21% { transform:scaleX(0) } 100% { transform:scaleX(0) } }
    @keyframes cl0 { 0%,18.01% { opacity:0; transform:scale(.3) } 19.03% { opacity:1; transform:scale(1.12) } 20.82% { opacity:0; transform:scale(1.65) } 100% { opacity:0 } }
    @keyframes sp0 { 0%,18.01% { opacity:0; transform:scale(.2) } 19.03% { opacity:1 } 21.60% { opacity:0; transform:scale(2.5) } 100% { opacity:0 } }
    @keyframes cl1 { 0%,43.03% { opacity:0; transform:scale(.3) } 44.05% { opacity:1; transform:scale(1.12) } 45.84% { opacity:0; transform:scale(1.65) } 100% { opacity:0 } }
    @keyframes sp1 { 0%,43.03% { opacity:0; transform:scale(.2) } 44.05% { opacity:1 } 46.62% { opacity:0; transform:scale(2.5) } 100% { opacity:0 } }
    @keyframes cl2 { 0%,44.92% { opacity:0; transform:scale(.3) } 45.95% { opacity:1; transform:scale(1.12) } 47.74% { opacity:0; transform:scale(1.65) } 100% { opacity:0 } }
    @keyframes sp2 { 0%,44.92% { opacity:0; transform:scale(.2) } 45.95% { opacity:1 } 48.52% { opacity:0; transform:scale(2.5) } 100% { opacity:0 } }
    @keyframes cl3 { 0%,75.07% { opacity:0; transform:scale(.3) } 76.09% { opacity:1; transform:scale(1.12) } 77.88% { opacity:0; transform:scale(1.65) } 100% { opacity:0 } }
    @keyframes sp3 { 0%,75.07% { opacity:0; transform:scale(.2) } 76.09% { opacity:1 } 78.66% { opacity:0; transform:scale(2.5) } 100% { opacity:0 } }
    .bd   { transform-box: fill-box; transform-origin: 0% 50%;
             animation: blade 12.84s cubic-bezier(.2,.8,.3,1) infinite both; }
    .halo { animation: hum .17s ease-in-out infinite alternate both; }
    .core { animation: humc .12s ease-in-out infinite alternate both; }
    .cl   { opacity: 0; transform-box: view-box; animation: 12.84s linear infinite both; }
    .spk circle { transform-box: view-box; animation: 12.84s linear infinite both; }
    .c0 { animation-name: cl0; } .c0 .spk circle { animation-name: sp0; }
    .c1 { animation-name: cl1; } .c1 .spk circle { animation-name: sp1; }
    .c2 { animation-name: cl2; } .c2 .spk circle { animation-name: sp2; }
    .c3 { animation-name: cl3; } .c3 .spk circle { animation-name: sp3; }
    @media (prefers-reduced-motion: reduce) {
      .bd, .halo, .core, .cl, .spk circle, .st { animation: none; }
      .bd { transform: none; } .cl { opacity: 0; }
    }
  </style>
