      <stop offset="80%" stop-color="#4c545e"/><stop offset="100%" stop-color="#242a32"/>
    </linearGradient>
    <linearGradient id="steel2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9aa4b1"/><stop offset="20%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#dbe2ea"/><stop offset="66%" stop-color="#97a1ad"/>
      <stop offset="100%" stop-color="#333b45"/>
    </linearGradient>
    <linearGradient id="blk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#454c56"/><stop offset="22%" stop-color="#1c2027"/>
      <stop offset="60%" stop-color="#0b0e13"/><stop offset="100%" stop-color="#030508"/>
    </linearGradient>
    <linearGradient id="brass2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b08a33"/><stop offset="22%" stop-color="#ffeec0"/>
      <stop offset="52%" stop-color="#d4ab51"/><stop offset="100%" stop-color="#5e4512"/>
    </linearGradient>
    <radialGradient id="jewel">
