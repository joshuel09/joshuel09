<svg xmlns="http://www.w3.org/2000/svg" width="420" height="30" viewBox="0 0 420 30" role="img" aria-label="lightsaber divider">
  <title>— lightsaber —</title>
  <metadata>Copyright (c) 2026 Joshuel Ranola (@joshuel09). All rights reserved. Unauthorised copying or redistribution prohibited. https://github.com/joshuel09</metadata>
  <defs>
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="420" height="30">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="hilt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b8f96"/><stop offset="50%" stop-color="#e5e7eb"/><stop offset="100%" stop-color="#4b5563"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes tw { 0%,100% { opacity:.15 } 50% { opacity:.95 } }
    @keyframes ignite { from { stroke-dashoffset:388 } to { stroke-dashoffset:0 } }
    @keyframes breathe { 0%,100% { opacity:.5 } 50% { opacity:.9 } }
    .beam { stroke-dasharray:388; stroke-dashoffset:0;
             animation:ignite 1.1s cubic-bezier(.2,.8,.3,1) .25s 1 both }
    .halo { stroke-dasharray:388; stroke-dashoffset:0;
             animation:ignite 1.1s cubic-bezier(.2,.8,.3,1) .25s 1 both,
                       breathe 3.6s ease-in-out 1.4s infinite both }
  </style>
  <rect width="420" height="30" fill="#000"/>
<circle cx="193.4" cy="16.5" r="0.73" fill="#fff" opacity="0.66" style="animation:tw 2.4s ease-in-out -0.31s infinite"/>
<circle cx="379.7" cy="21.7" r="0.59" fill="#fff" opacity="1.0" style="animation:tw 3.2s ease-in-out -1.13s infinite"/>
<circle cx="275.0" cy="5.9" r="0.56" fill="#fff" opacity="0.37" style="animation:tw 4.1s ease-in-out -1.85s infinite"/>
<circle cx="80.4" cy="0.2" r="0.46" fill="#fff" opacity="0.71" style="animation:tw 5.0s ease-in-out -4.25s infinite"/>
<circle cx="131.6" cy="23.5" r="0.66" fill="#fff" opacity="1.0" style="animation:tw 2.4s ease-in-out -1.96s infinite"/>
<circle cx="2.1" cy="6.3" r="0.4" fill="#fff" opacity="0.75" style="animation:tw 3.2s ease-in-out -3.13s infinite"/>
<circle cx="80.3" cy="1.4" r="0.57" fill="#fff" opacity="0.98" style="animation:tw 4.1s ease-in-out -4.06s infinite"/>
<circle cx="398.2" cy="24.4" r="0.74" fill="#fff" opacity="0.52" style="animation:tw 5.0s ease-in-out -2.14s infinite"/>
<circle cx="66.0" cy="6.6" r="0.47" fill="#fff" opacity="0.85" style="animation:tw 2.4s ease-in-out -2.38s infinite"/>
<circle cx="226.7" cy="20.0" r="0.66" fill="#fff" opacity="0.58" style="animation:tw 3.2s ease-in-out -0.7s infinite"/>
<circle cx="271.1" cy="18.5" r="0.45" fill="#fff" opacity="0.99" style="animation:tw 4.1s ease-in-out -2.89s infinite"/>
<circle cx="166.1" cy="30.0" r="0.75" fill="#fff" opacity="0.68" style="animation:tw 5.0s ease-in-out -3.56s infinite"/>
<circle cx="121.4" cy="17.2" r="0.71" fill="#fff" opacity="0.95" style="animation:tw 2.4s ease-in-out -2.29s infinite"/>
<circle cx="139.9" cy="29.6" r="0.91" fill="#fff" opacity="0.48" style="animation:tw 3.2s ease-in-out -3.12s infinite"/>
<circle cx="65.5" cy="13.4" r="0.39" fill="#fff" opacity="0.41" style="animation:tw 4.1s ease-in-out -1.76s infinite"/>
<circle cx="142.5" cy="14.5" r="0.86" fill="#fff" opacity="0.67" style="animation:tw 5.0s ease-in-out -2.34s infinite"/>
<circle cx="372.6" cy="14.8" r="0.88" fill="#fff" opacity="0.78" style="animation:tw 2.4s ease-in-out -1.71s infinite"/>
<circle cx="134.9" cy="1.6" r="0.87" fill="#fff" opacity="0.79" style="animation:tw 3.2s ease-in-out -3.03s infinite"/>
<circle cx="5.3" cy="20.4" r="0.75" fill="#fff" opacity="0.82" style="animation:tw 4.1s ease-in-out -1.28s infinite"/>
<circle cx="333.5" cy="7.0" r="0.41" fill="#fff" opacity="0.49" style="animation:tw 5.0s ease-in-out -1.64s infinite"/>
<circle cx="194.3" cy="4.6" r="0.95" fill="#fff" opacity="0.67" style="animation:tw 2.4s ease-in-out -2.31s infinite"/>
<circle cx="223.0" cy="16.7" r="0.36" fill="#fff" opacity="0.39" style="animation:tw 3.2s ease-in-out -2.71s infinite"/>
<circle cx="303.4" cy="2.1" r="0.84" fill="#fff" opacity="0.42" style="animation:tw 4.1s ease-in-out -2.65s infinite"/>
<circle cx="363.1" cy="7.0" r="0.83" fill="#fff" opacity="0.83" style="animation:tw 5.0s ease-in-out -3.01s infinite"/>
<circle cx="103.3" cy="23.9" r="0.53" fill="#fff" opacity="0.64" style="animation:tw 2.4s ease-in-out -1.06s infinite"/>
<circle cx="279.9" cy="26.8" r="0.78" fill="#fff" opacity="0.45" style="animation:tw 3.2s ease-in-out -1.73s infinite"/>
  <rect x="4" y="9" width="18" height="12" rx="2.5" fill="url(#hilt)"/>
  <rect x="8" y="11" width="2" height="8" fill="#0b0b12" opacity=".8"/>
  <rect x="14" y="11" width="2" height="8" fill="#0b0b12" opacity=".8"/>
  <line class="halo" x1="24" y1="15" x2="412" y2="15" stroke="#4BD5EE" stroke-width="11" stroke-linecap="round" filter="url(#glow)" opacity=".5"/>
  <line class="beam" x1="24" y1="15" x2="412" y2="15" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round"/>
</svg>
