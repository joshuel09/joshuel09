  <defs>
    <linearGradient id="hilt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b8f96"/><stop offset="38%" stop-color="#eef1f5"/>
      <stop offset="62%" stop-color="#7c8795"/><stop offset="100%" stop-color="#394049"/>
    </linearGradient>
    <linearGradient id="hilt2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8c2cf"/><stop offset="45%" stop-color="#f4f7fa"/>
      <stop offset="100%" stop-color="#3b434e"/>
    </linearGradient>
    <linearGradient id="halo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#45E06A" stop-opacity="0"/>
      <stop offset="50%" stop-color="#45E06A" stop-opacity=".66"/>
      <stop offset="100%" stop-color="#45E06A" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="burst">
      <stop offset="0%" stop-color="#fff" stop-opacity=".95"/>
      <stop offset="42%" stop-color="#45E06A" stop-opacity=".7"/>
      <stop offset="100%" stop-color="#45E06A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    @keyframes tw { 0%,100% { opacity:.15 } 50% { opacity:.95 } }
    @keyframes hum  { from { opacity:.52 } to { opacity:.98 } }
    @keyframes humc { from { opacity:.80 } to { opacity:1 } }
    @keyframes blade { 0% { transform:scaleX(0) } 2.35% { transform:scaleX(0) } 4.53% { transform:scaleX(1.06) } 5.88% { transform:scaleX(1) } 23.09% { transform:scaleX(1) } 24.94% { transform:scaleX(0) } 32.66% { transform:scaleX(0) } 34.84% { transform:scaleX(1.06) } 36.19% { transform:scaleX(1) } 47.77% { transform:scaleX(1) } 49.62% { transform:scaleX(0) } 61.13% { transform:scaleX(0) } 63.31% { transform:scaleX(1.06) } 64.65% { transform:scaleX(1) } 85.81% { transform:scaleX(1) } 87.66% { transform:scaleX(0) } 100% { transform:scaleX(0) } }
    @keyframes cl0 { 0%,11.32% { opacity:0; transform:scale(.3) } 12.42% { opacity:1; transform:scale(1.12) } 14.35% { opacity:0; transform:scale(1.65) } 100% { opacity:0 } }
    @keyframes sp0 { 0%,11.32% { opacity:0; transform:scale(.2) } 12.42% { opacity:1 } 15.19% { opacity:0; transform:scale(2.5) } 100% { opacity:0 } }
    @keyframes cl1 { 0%,41.25% { opacity:0; transform:scale(.3) } 42.35% { opacity:1; transform:scale(1.12) } 44.28% { opacity:0; transform:scale(1.65) } 100% { opacity:0 } }
    @keyframes sp1 { 0%,41.25% { opacity:0; transform:scale(.2) } 42.35% { opacity:1 } 45.12% { opacity:0; transform:scale(2.5) } 100% { opacity:0 } }
    @keyframes cl2 { 0%,69.36% { opacity:0; transform:scale(.3) } 70.46% { opacity:1; transform:scale(1.12) } 72.39% { opacity:0; transform:scale(1.65) } 100% { opacity:0 } }
    @keyframes sp2 { 0%,69.36% { opacity:0; transform:scale(.2) } 70.46% { opacity:1 } 73.23% { opacity:0; transform:scale(2.5) } 100% { opacity:0 } }
    @keyframes cl3 { 0%,72.10% { opacity:0; transform:scale(.3) } 73.20% { opacity:1; transform:scale(1.12) } 75.13% { opacity:0; transform:scale(1.65) } 100% { opacity:0 } }
    @keyframes sp3 { 0%,72.10% { opacity:0; transform:scale(.2) } 73.20% { opacity:1 } 75.97% { opacity:0; transform:scale(2.5) } 100% { opacity:0 } }
    .bd   { transform-box: fill-box; transform-origin: 0% 50%;
             animation: blade 11.91s cubic-bezier(.2,.8,.3,1) infinite both; }
    .halo { animation: hum .17s ease-in-out infinite alternate both; }
    .core { animation: humc .12s ease-in-out infinite alternate both; }
    .cl   { opacity: 0; transform-box: view-box; animation: 11.91s linear infinite both; }
    .spk circle { transform-box: view-box; animation: 11.91s linear infinite both; }
    .c0 { animation-name: cl0; } .c0 .spk circle { animation-name: sp0; }
    .c1 { animation-name: cl1; } .c1 .spk circle { animation-name: sp1; }
    .c2 { animation-name: cl2; } .c2 .spk circle { animation-name: sp2; }
    .c3 { animation-name: cl3; } .c3 .spk circle { animation-name: sp3; }
    @media (prefers-reduced-motion: reduce) {
      .bd, .halo, .core, .cl, .spk circle, .st { animation: none; }
      .bd { transform: none; } .cl { opacity: 0; }
    }
  </style>
