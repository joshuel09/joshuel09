<svg xmlns="http://www.w3.org/2000/svg" width="420" height="30" viewBox="0 0 420 30" role="img" aria-label="lightsaber divider">
  <title>— lightsaber —</title>
  <defs>
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="420" height="30">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="hilt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b8f96"/><stop offset="50%" stop-color="#e5e7eb"/><stop offset="100%" stop-color="#4b5563"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes tw { 0%,100% { opacity:.15 } 50% { opacity:.95 } }
    @keyframes ignite { from { stroke-dashoffset:388 } to { stroke-dashoffset:0 } }
    @keyframes breathe { 0%,100% { opacity:.5 } 50% { opacity:.9 } }
    .beam { stroke-dasharray:388; stroke-dashoffset:0;
             animation:ignite 1.1s cubic-bezier(.2,.8,.3,1) .25s 1 both }
    .halo { stroke-dasharray:388; stroke-dashoffset:0;
             animation:ignite 1.1s cubic-bezier(.2,.8,.3,1) .25s 1 both,
                       breathe 3.6s ease-in-out 1.4s infinite both }
  </style>
  <rect width="420" height="30" fill="#000"/>
<circle cx="235.0" cy="24.1" r="0.59" fill="#fff" opacity="0.7" style="animation:tw 2.4s ease-in-out -1.78s infinite"/>
<circle cx="414.4" cy="21.2" r="0.72" fill="#fff" opacity="0.5" style="animation:tw 3.2s ease-in-out -0.85s infinite"/>
<circle cx="64.9" cy="5.3" r="0.91" fill="#fff" opacity="0.62" style="animation:tw 4.1s ease-in-out -0.15s infinite"/>
<circle cx="119.5" cy="4.0" r="0.85" fill="#fff" opacity="0.84" style="animation:tw 5.0s ease-in-out -3.45s infinite"/>
<circle cx="343.8" cy="7.2" r="0.45" fill="#fff" opacity="0.38" style="animation:tw 2.4s ease-in-out -1.04s infinite"/>
<circle cx="273.8" cy="5.6" r="0.94" fill="#fff" opacity="0.44" style="animation:tw 3.2s ease-in-out -2.1s infinite"/>
<circle cx="287.9" cy="7.3" r="0.55" fill="#fff" opacity="0.47" style="animation:tw 4.1s ease-in-out -2.6s infinite"/>
<circle cx="63.7" cy="24.7" r="0.47" fill="#fff" opacity="0.4" style="animation:tw 5.0s ease-in-out -2.73s infinite"/>
<circle cx="134.8" cy="24.4" r="0.93" fill="#fff" opacity="0.58" style="animation:tw 2.4s ease-in-out -1.04s infinite"/>
<circle cx="363.0" cy="24.7" r="0.83" fill="#fff" opacity="0.56" style="animation:tw 3.2s ease-in-out -2.22s infinite"/>
<circle cx="204.8" cy="5.0" r="0.94" fill="#fff" opacity="0.78" style="animation:tw 4.1s ease-in-out -3.31s infinite"/>
<circle cx="133.9" cy="27.3" r="0.5" fill="#fff" opacity="0.84" style="animation:tw 5.0s ease-in-out -1.88s infinite"/>
<circle cx="366.9" cy="20.5" r="0.56" fill="#fff" opacity="0.82" style="animation:tw 2.4s ease-in-out -1.69s infinite"/>
<circle cx="362.7" cy="6.7" r="0.56" fill="#fff" opacity="0.85" style="animation:tw 3.2s ease-in-out -3.1s infinite"/>
<circle cx="121.4" cy="10.2" r="0.94" fill="#fff" opacity="0.54" style="animation:tw 4.1s ease-in-out -1.55s infinite"/>
<circle cx="267.7" cy="4.4" r="0.69" fill="#fff" opacity="0.46" style="animation:tw 5.0s ease-in-out -1.29s infinite"/>
<circle cx="230.8" cy="21.8" r="0.83" fill="#fff" opacity="0.89" style="animation:tw 2.4s ease-in-out -0.89s infinite"/>
<circle cx="186.3" cy="1.4" r="0.51" fill="#fff" opacity="0.68" style="animation:tw 3.2s ease-in-out -1.26s infinite"/>
<circle cx="146.4" cy="8.5" r="0.65" fill="#fff" opacity="0.93" style="animation:tw 4.1s ease-in-out -1.21s infinite"/>
<circle cx="280.7" cy="13.5" r="0.6" fill="#fff" opacity="0.38" style="animation:tw 5.0s ease-in-out -4.38s infinite"/>
<circle cx="170.3" cy="8.8" r="0.72" fill="#fff" opacity="0.96" style="animation:tw 2.4s ease-in-out -0.87s infinite"/>
<circle cx="287.4" cy="20.7" r="0.74" fill="#fff" opacity="0.77" style="animation:tw 3.2s ease-in-out -0.1s infinite"/>
<circle cx="205.3" cy="28.1" r="0.89" fill="#fff" opacity="0.43" style="animation:tw 4.1s ease-in-out -3.0s infinite"/>
<circle cx="313.4" cy="26.0" r="0.58" fill="#fff" opacity="0.6" style="animation:tw 5.0s ease-in-out -4.52s infinite"/>
<circle cx="152.0" cy="18.8" r="0.86" fill="#fff" opacity="0.63" style="animation:tw 2.4s ease-in-out -1.99s infinite"/>
<circle cx="154.0" cy="14.1" r="0.77" fill="#fff" opacity="0.78" style="animation:tw 3.2s ease-in-out -0.2s infinite"/>
  <rect x="4" y="9" width="18" height="12" rx="2.5" fill="url(#hilt)"/>
  <rect x="8" y="11" width="2" height="8" fill="#0b0b12" opacity=".8"/>
  <rect x="14" y="11" width="2" height="8" fill="#0b0b12" opacity=".8"/>
  <line class="halo" x1="24" y1="15" x2="412" y2="15" stroke="#45E06A" stroke-width="11" stroke-linecap="round" filter="url(#glow)" opacity=".5"/>
  <line class="beam" x1="24" y1="15" x2="412" y2="15" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round"/>
</svg>
