<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" role="img" aria-label="Jedi Order crest"><title>Jedi Order crest</title>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe9a8"/><stop offset="45%" stop-color="#f0c04e"/>
      <stop offset="100%" stop-color="#a9761c"/>
    </linearGradient>
  </defs>
  <style>
    .ink{stroke:#1b2029;stroke-linejoin:round;stroke-linecap:round}
    .cr{transform-box:view-box;transform-origin:24px 26px;animation:breathe 3.4s ease-in-out infinite}
    .sp{animation:spark 2.8s ease-in-out infinite}
    @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
    @keyframes spark{0%,100%{opacity:.25}50%{opacity:.9}}
    @media (prefers-reduced-motion:reduce){.cr,.sp{animation:none}}
  </style>
  <g class="cr">
    <g class="ink" stroke-width="2.1" fill="url(#gold)">
      <path d="M19.4 31.5 C11 29.6 6.5 23.4 5.6 15.6 C9.6 21.6 14.2 24.6 19.4 25.4 Z"/>
      <path d="M28.6 31.5 C37 29.6 41.5 23.4 42.4 15.6 C38.4 21.6 33.8 24.6 28.6 25.4 Z"/>
      <path d="M21.4 42 L21.4 15.5 H26.6 L26.6 42 Z"/>
      <circle cx="24" cy="10.6" r="5.1"/>
      <path d="M17.6 41 H30.4 L31.8 44.6 H16.2 Z"/>
    </g>
    <circle class="sp" cx="24" cy="10.6" r="2.3" fill="#fff6d8"/>
  </g>
</svg>
