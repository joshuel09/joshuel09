      <defs>
        <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1000" height="34">
          <feGaussianBlur stdDeviation="3.2" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <linearGradient id="hilt" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#8b8f96"/><stop offset="50%" stop-color="#e5e7eb"/><stop offset="100%" stop-color="#4b5563"/>
        </linearGradient>
      </defs>
      <style>
        @keyframes tw { 0%,100% { opacity:.15 } 50% { opacity:.95 } }
        @keyframes ignite { from { stroke-dashoffset:952 } to { stroke-dashoffset:0 } }
        @keyframes breathe { 0%,100% { opacity:.45 } 50% { opacity:.85 } }
        .beam { stroke-dasharray:952; stroke-dashoffset:0;
                 animation:ignite 1.1s cubic-bezier(.2,.8,.3,1) .25s 1 both }
        .halo { stroke-dasharray:952; stroke-dashoffset:0;
                 animation:ignite 1.1s cubic-bezier(.2,.8,.3,1) .25s 1 both,
                           breathe 3.6s ease-in-out 1.4s infinite both }
      </style>
