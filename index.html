<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>JOSU SAMA — Opening Crawl</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden;
    color: #FFE81F;
    font: 700 13px/1.4 "Franklin Gothic Medium", "Arial Narrow", Arial, sans-serif;
    letter-spacing: 1.5px;
  }

  /* the crawl fills the viewport; its own black ground hides the letterbox */
  #crawl {
    position: fixed; inset: 0; z-index: 1;
    width: 100%; height: 100%;
    object-fit: contain;
    background: #000;          /* opaque, so it fully hides the player behind it */
    display: block;
  }

  /* iOS refuses to play media in an offscreen or 1x1 element, so the player is
     full-size and on-screen -- just covered by #crawl. */
  #player {
    position: fixed; inset: 0; z-index: 0;
    width: 100%; height: 100%; border: 0;
    pointer-events: none;
  }

  /* ---- old-VFX layer over the whole page ------------------------------ */
  /* Vignette + flicker across the whole page, including the black bands and
     the UI. Scanlines removed -- they smeared the text at small sizes. */
  #crt {
    position: fixed; inset: 0; z-index: 3; pointer-events: none;
    background:
      radial-gradient(ellipse at 50% 50%,
        rgba(0,0,0,0) 52%, rgba(0,0,0,.30) 78%, rgba(0,0,0,.66) 100%);
    animation: flick 2.4s steps(1, end) infinite;
  }
  @keyframes flick {
    0%, 100% { opacity: 1 }
    7%       { opacity: .82 }
    11%      { opacity: 1 }
    23%      { opacity: .92 }
    27%      { opacity: 1 }
    54%      { opacity: .86 }
    57%      { opacity: 1 }
    81%      { opacity: .95 }
    84%      { opacity: 1 }
  }
  @media (prefers-reduced-motion: reduce) { #crt { animation: none } }

  /* ---- control bar ---------------------------------------------------- */
  #bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 2;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
    gap: 10px 14px;
    padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(to top, rgba(0,0,0,.92), rgba(0,0,0,0));
    opacity: 0; pointer-events: none;
    transition: opacity .28s ease;
  }
  #bar.show { opacity: 1; pointer-events: auto; }

  button {
    font: inherit; letter-spacing: 2px; cursor: pointer; white-space: nowrap;
    color: #FFE81F; background: rgba(11,11,18,.9); border: 2px solid #FFE81F;
    padding: 11px 22px; border-radius: 2px;
    transition: background .15s, color .15s;
  }
  button:hover, button:focus-visible { background: #FFE81F; color: #0b0b12; outline: none; }
  a {
    color: #4BD5EE; text-decoration: none; letter-spacing: 2px;
    padding: 11px 6px; white-space: nowrap;
  }
  a:hover, a:focus-visible { text-decoration: underline; }
  #hint { opacity: .6; letter-spacing: 1.5px; margin: 0; flex-basis: 100%; text-align: center; }

  /* ---- touch devices: no hover, so pin the bar open -------------------- */
  @media (hover: none), (pointer: coarse) {
    #bar { opacity: 1; pointer-events: auto; }
  }

  /* ---- small screens --------------------------------------------------- */
  @media (max-width: 640px) {
    html, body { font-size: 11px; letter-spacing: 1px; }
    #bar { gap: 8px 10px; padding: 12px 10px calc(12px + env(safe-area-inset-bottom, 0px)); }
    button { padding: 10px 14px; letter-spacing: 1px; }
    a { padding: 10px 4px; }
  }
</style>
</head>
<body>

<div id="crt" aria-hidden="true"></div>

<img id="crawl" alt="A long time ago, in a repository far, far away.... JOSU SAMA">

<div id="bar">
  <button id="engage" type="button">&#9654; ENGAGE AUDIO</button>
  <button id="replay" type="button">&#8635; REPLAY</button>
  <a href="https://github.com/joshuel09">&#10217; RETURN TO PROFILE</a>
  <p id="hint"></p>
</div>

<div id="player"></div>

<script>
(function () {
  var VIDEO = '_D0ZQPqeJkk';

  // The crawl rolls immediately. The fanfare must land on the JOSU SAMA logo,
  // which the SVG brings up at 6.1s -- and this upload has ~1s of silence at the
  // head, so playback starts at 5.5s and the first note arrives just after it.
  var AUDIO_DELAY = 5500;
  var CYCLE = 76000;   // hero.svg's own loop length -- re-roll in lockstep
  var FADE  = 3000;    // ramp to silence across the last 3s of each cycle

  var crawl  = document.getElementById('crawl');
  var engage = document.getElementById('engage');
  var replay = document.getElementById('replay');
  var hint   = document.getElementById('hint');
  var bar    = document.getElementById('bar');
  var player = null, audioTimer = null, loopTimer = null, unlocked = false;

  // A landscape crawl is a thin strip on a phone, so portrait viewports get
  // their own taller artwork with the copy rewrapped to shorter lines.
  var portraitMQ = window.matchMedia('(max-aspect-ratio: 1/1)');
  function heroSrc() {
    return (portraitMQ.matches ? 'assets/hero-portrait.svg' : 'assets/hero.svg')
           + '?t=' + Date.now();
  }
  var fadeTimer = null, fadeStep = null, hideTimer = null;

  // ---- controls: reveal near the bottom edge, pointer devices only --------
  var coarse = window.matchMedia('(hover: none), (pointer: coarse)').matches;

  function showBar() {
    bar.classList.add('show');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(function () { bar.classList.remove('show'); }, 2600);
  }

  if (!coarse) {
    // any cursor movement reveals it; it still lives at the bottom
    document.addEventListener('mousemove', showBar);
    // keyboard users must still be able to reach the controls
    bar.addEventListener('focusin', showBar);
  }

  // ---- audio -------------------------------------------------------------
  function setVol(v) {
    if (player && player.setVolume) { try { player.setVolume(v); } catch (err) {} }
  }

  function fadeOut() {
    clearInterval(fadeStep);
    var steps = 60, i = 0;
    fadeStep = setInterval(function () {
      i += 1;
      var v = Math.max(0, Math.round(100 * (1 - i / steps)));
      setVol(v);
      hint.textContent = 'Fading out… ' + v + '%';
      if (i >= steps) {
        clearInterval(fadeStep);
        hint.textContent = '';
      }
    }, FADE / steps);
  }

  function cueAudio() {
    clearTimeout(audioTimer);
    clearTimeout(fadeTimer);
    clearInterval(fadeStep);
    if (player) { try { player.pauseVideo(); } catch (err) {} }
    audioTimer = setTimeout(function () {
      if (!player) return;
      setVol(100);
      player.seekTo(0);
      player.playVideo();
    }, AUDIO_DELAY);
    fadeTimer = setTimeout(fadeOut, CYCLE - FADE);
  }

  // Re-fetching the SVG restarts its CSS animations.
  function roll() {
    crawl.src = heroSrc();
    cueAudio();
  }

  // Everything hangs off this one clock, so the fade lands exactly on the re-roll.
  function start() {
    clearInterval(loopTimer);
    roll();
    loopTimer = setInterval(roll, CYCLE);
  }

  var tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(tag);

  window.onYouTubeIframeAPIReady = function () {
    player = new YT.Player('player', {
      videoId: VIDEO,
      playerVars: { controls: 0, playsinline: 1, loop: 1, playlist: VIDEO },
      events: {
        onReady: function () {
          start();   // re-anchor the whole loop here
        },
        onStateChange: function (e) {
          if (e.data === YT.PlayerState.PLAYING) engage.hidden = true;
          var names = {'-1':'unstarted','0':'ended','1':'playing','2':'paused',
                       '3':'buffering','5':'cued'};
          hint.textContent = 'audio: ' + (names[String(e.data)] || e.data);
        },
        onError: function (e) { hint.textContent = 'audio error ' + e.data; }
      }
    });
  };

  var mqHandler = function () { start(); };
  if (portraitMQ.addEventListener) portraitMQ.addEventListener('change', mqHandler);
  else if (portraitMQ.addListener) portraitMQ.addListener(mqHandler);

  // iOS grants playback only inside the gesture's own call stack, and a
  // setTimeout'd play is refused. Play+pause once on the tap to unlock the
  // element; after that the delayed play is allowed for the rest of the session.
  function unlock() {
    if (player && !unlocked) {
      try { player.playVideo(); player.pauseVideo(); unlocked = true; } catch (err) {}
    }
  }
  function tap() { unlock(); start(); }

  engage.addEventListener('click', tap);
  replay.addEventListener('click', tap);

  // show the crawl at once; the API re-anchors the loop a moment later
  crawl.src = heroSrc();
  if (coarse) bar.classList.add('show');
})();
</script>

</body>
</html>
