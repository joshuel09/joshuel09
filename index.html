<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JOSU SAMA — Opening Crawl</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: #000; color: #FFE81F;
    font: 700 14px/1.5 "Franklin Gothic Medium", "Arial Narrow", Arial, sans-serif;
    letter-spacing: 1px;
  }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 20px; padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    overflow: hidden;
  }
  #stage { width: 100%; max-width: 1100px; aspect-ratio: 1000 / 560; }
  #crawl { width: 100%; height: 100%; display: block; }
  .controls { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; min-height: 48px; }
  button {
    font: inherit; letter-spacing: 2px; cursor: pointer;
    color: #FFE81F; background: #0b0b12; border: 2px solid #FFE81F;
    padding: 12px 26px; border-radius: 2px; transition: background .15s, color .15s;
  }
  button:hover, button:focus-visible { background: #FFE81F; color: #0b0b12; outline: none; }
  a { color: #4BD5EE; text-decoration: none; font-size: 12px; letter-spacing: 2px; }
  a:hover { text-decoration: underline; }
  .hint { opacity: .55; font-size: 12px; letter-spacing: 2px; text-align: center; margin: 0; }
  /* kept in layout, not display:none -- browsers stop playback on hidden frames */
  #bgm { position: fixed; left: -9999px; width: 1px; height: 1px; border: 0; }
  @media (max-width: 600px) { button { padding: 10px 18px; letter-spacing: 1px; } }
</style>
</head>
<body>

<div id="stage"><img id="crawl" alt="A long time ago, in a repository far, far away.... JOSU SAMA"></div>

<div class="controls">
  <button id="engage" type="button" hidden>&#9654; ENGAGE AUDIO</button>
  <button id="replay" type="button">&#8635; REPLAY</button>
</div>

<p class="hint" id="hint"></p>
<a href="https://github.com/joshuel09">&#10217; RETURN TO PROFILE</a>

<div id="player"></div>

<script>
(function () {
  var VIDEO = '_D0ZQPqeJkk';

  // The crawl rolls immediately. The fanfare must land on the JOSU SAMA logo,
  // which the SVG brings up at 6.1s -- and this upload has ~1s of silence at the
  // head, so playback starts at 4s and the first note arrives right on the logo.
  var AUDIO_DELAY = 4500;
  var CYCLE = 76000;   // hero.svg's own loop length -- re-roll in lockstep with it
  var FADE  = 3000;    // ramp to silence across the last 3s of each cycle

  var crawl  = document.getElementById('crawl');
  var engage = document.getElementById('engage');
  var replay = document.getElementById('replay');
  var hint   = document.getElementById('hint');
  var player = null, audioTimer = null, loopTimer = null, fadeTimer = null, fadeStep = null;

  // The API rejects calls before the player is ready, so guard every volume touch.
  function setVol(v) {
    if (player && player.setVolume) { try { player.setVolume(v); } catch (err) {} }
  }

  function fadeOut() {
    clearInterval(fadeStep);
    var steps = 30, i = 0;
    fadeStep = setInterval(function () {
      i += 1;
      setVol(Math.max(0, Math.round(100 * (1 - i / steps))));
      if (i >= steps) clearInterval(fadeStep);
    }, FADE / steps);
  }

  function cueAudio() {
    clearTimeout(audioTimer);
    clearTimeout(fadeTimer);
    clearInterval(fadeStep);
    if (player) { player.stopVideo(); }
    audioTimer = setTimeout(function () {
      if (!player) return;
      setVol(100);            // restore after any previous fade
      player.seekTo(0);
      player.playVideo();
    }, AUDIO_DELAY);
    fadeTimer = setTimeout(fadeOut, CYCLE - FADE);
  }

  // Re-fetching the SVG restarts its CSS animations.
  function roll() {
    crawl.src = 'assets/hero.svg?t=' + Date.now();
    cueAudio();
  }

  // Drive the loop from here rather than leaning on the SVG's internal repeat,
  // so the music restarts with the same offset on every pass.
  function start() {
    clearInterval(loopTimer);
    roll();
    hint.textContent = 'The crawl loops every 76 seconds.';
    loopTimer = setInterval(roll, CYCLE);
  }

  var tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(tag);

  window.onYouTubeIframeAPIReady = function () {
    player = new YT.Player('player', {
      videoId: VIDEO,
      playerVars: { controls: 0, playsinline: 1, loop: 1, playlist: VIDEO },
      events: {
        onReady: function () {
          document.getElementById('player').id = 'bgm';
          cueAudio();
          // Check after the cue has fired: if it never started, autoplay was blocked.
          setTimeout(function () {
            if (!player || player.getPlayerState() !== YT.PlayerState.PLAYING) {
              engage.hidden = false;
            }
          }, AUDIO_DELAY + 1500);
        },
        onStateChange: function (e) {
          if (e.data === YT.PlayerState.PLAYING) engage.hidden = true;
        }
      }
    });
  };

  // A real click satisfies the gesture rule; restart both so they stay in sync.
  engage.addEventListener('click', start);
  replay.addEventListener('click', start);

  start();
})();
</script>

</body>
</html>
